name: Cleanly
description: Cleanly was a US-based on-demand laundry and dry-cleaning startup (backed by 500 Global
  and Y Combinator) that has since rebranded and now operates as ByNext at bynext.co. ByNext is an
  app-based, on-demand laundry, dry cleaning, and home cleaning pickup and delivery service operating
  7 days a week (8am-8pm) with 24-48 hour turnaround across metro markets including New York City,
  New Jersey, the Washington D.C. area, and Los Angeles. Booking is handled through its iOS and
  Android apps with real-time driver tracking, pay-per-pound or subscription pricing, and free pickup
  and delivery. Cleanly/ByNext exposes no public developer API surface; this profile captures the
  company's public web and consumer-app footprint. The original cleanly.com domain now redirects to
  bynext.co.
